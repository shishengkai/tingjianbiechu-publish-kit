[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tingjianbiechu-publish-kit"
version = "0.1.0"
description = "听见别处：抖音发布文案与三比例封面本地生成工具"
readme = "docs/v0.1-scope.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "shishengkai" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
tjbc-publish = "tingjianbiechu_publish_kit.cli:main"

[tool.setuptools.packages.find]
include = ["tingjianbiechu_publish_kit*"]

[tool.setuptools.package-data]
tingjianbiechu_publish_kit = ["py.typed"]
